[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "geez"
version = "0.1.0"
description = "Phone-first MCP tool that lets Claude call Grok. Minimal, requests-only."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "fitzyracing1" }]
keywords = ["mcp", "grok", "xai", "claude", "phone-first"]

dependencies = [
    "mcp>=1.2.0,<2",
    "requests>=2.31",
]

[project.scripts]
geez = "geez.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
